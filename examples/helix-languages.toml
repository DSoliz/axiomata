# Helix editor language configuration for .axm files.
# Copy the relevant sections into ~/.config/helix/languages.toml
# (or merge with your existing file).
#
# Replace /path/to/axiomata with the absolute path to this repo.

[[language]]
name = "axm"
scope = "source.axm"
file-types = ["axm"]
comment-token = "//"
indent = { tab-width = 2, unit = "  " }
roots = []
language-servers = ["axiomata-lsp"]

[language-server.axiomata-lsp]
command = "node"
args = ["/path/to/axiomata/lsp/dist/index.js"]
