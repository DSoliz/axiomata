# Helix editor language configuration for .axm files.
# Merge the relevant sections into ~/.config/helix/languages.toml.
#
# Replace /path/to/axiomata with the absolute path to this repo.
# Assumes you have run `pnpm add -g ./lsp` so `axiomata-lsp` is on PATH.

[[language]]
name = "axm"
scope = "source.axm"
file-types = ["axm"]
comment-token = "//"
indent = { tab-width = 2, unit = "  " }
roots = []
language-servers = ["axiomata-lsp"]

[[grammar]]
name = "axm"
source = { path = "/path/to/axiomata/tree-sitter-axm" }

[language-server.axiomata-lsp]
command = "axiomata-lsp"
